<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Nahum</title>

    <!-- CSS stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/cubano" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Chango&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Gorditas:wght@400;700&family=Mochiy+Pop+One&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

    <!-- Header Section (Logo, Navbar, kag Settings)-->
    <header class="header">

            <!-- Cafe Nahum Logo -->
            <a class="logo" href="index.html" aria-label="Home">
                <img src="images/nahumlogo.png" alt="Cafe Nahum Logo" >
            </a>

            <!-- Middle Floating Navbar -->
            <nav class="main-nav" aria-label="Main navigation">
                <a class="active" href="index.html">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="services.html">SERVICES</a>
                <a href="gallery.html">GALLERY</a>
                <a href="contact.html">CONTACT</a>
            </nav>

            <!-- Right Icon Settings -->
            <div class="nav-icon">
                <a href="settings.html" aria-label="Settings">
                    <i class="bi bi-gear"></i>
                </a>
            </div>

  </header>

  <main class="hero">

        <h1 class="hero-title">NAHUMANS</h1>

            <div class="content-position">
                <div class="content">
                    <!-- Coffee Cup Image -->
                    <div class="coffee-cup">
                        <img src="images/coffeecup.png" alt="Coffee Cup" >
                    </div>
                </div>
            </div>

        <div class="hero-left">
            <p>
              CAFE NAHUM CREATES WARM, INSPIRING SPACES
              WHERE COMMUNITY, CREATIVITY, AND QUALITY
              COFFEE COME TOGETHER.
            </p>

            <div class="hero-buttons">
                <a href="contact.html" class="visit-button">VISIT US</a>
                <a href="services.html" class="menu-button">VIEW OUR MENU</a>
            </div>
        </div>

        <div class="hero-right">
            <h2>YOUR COZY CORNER,<br>EVERY DAY.</h2>
        </div>
  </main>

  <footer class="footer">
        <p>&copy; 2024 Cafe Nahum. All rights reserved.</p>
        <div class="footer-design">
            <img src="images/Footer-Design.png" alt="Footer Design" >
        </div>
    </footer>
</body>


</html>
